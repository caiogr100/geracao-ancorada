[project]
name = "geracao-ancorada"
version = "0.1.0"
description = "Harness experimental de geração ancorada de comentários de questões de residência médica"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "pdfplumber>=0.11.10",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geracao_ancorada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not corpus and not gpu'"
markers = [
    "corpus: precisa dos PDF baixados e leva minutos",
    "gpu: precisa do Ollama no ar com o modelo de embedding carregado",
]
